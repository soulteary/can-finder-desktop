name: Release Desktop App

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  release:
    name: Release Desktop App
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build name with tag
        shell: bash
        run: |
          OS_NAME=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          if [ "$OS_NAME" = "macos" ]; then OS_NAME="darwin"; fi
          echo "BUILD_NAME=can-finder-${GITHUB_REF_NAME}.${OS_NAME}-amd64" >> $GITHUB_ENV
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0"
            echo "BUILD_NAME=can-finder-${GITHUB_SHA:0:8}.${OS_NAME}-amd64" >> "$GITHUB_ENV"
          fi
          echo "BUILD_VER=$version" >> $GITHUB_ENV

      - name: Echo vars
        shell: bash
        run: |
          echo "Build name: ${{ env.BUILD_NAME }}"
          echo "Version: ${{ env.BUILD_VER }}"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev jq build-essential pkg-config

      - name: Install macOS prerequisites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install gtk+3 jq pkg-config

      - name: Install Windows prerequisites
        if: runner.os == 'Windows'
        uses: crazy-max/ghaction-chocolatey@v2
        with:
          args: install nsis jq

      - name: Add NSIS to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS'
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) {
            throw 'NSIS compiler was not installed'
          }
          $nsis | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
          wails doctor

      - name: Build App (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wails build -clean -tags webkit2_41 -o ${{ env.BUILD_NAME }}

      - name: Build App (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          wails build -clean -platform darwin/universal

      - name: Build NSIS Installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          wails build -clean -nsis -webview2 embed

      - name: Show build files (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem ./build/bin -Recurse -Force

      - name: Rename Windows Installer
        if: runner.os == 'Windows'
        working-directory: ./build/bin
        shell: powershell
        run: |
          $installer = Get-ChildItem "*-installer.exe" | Select-Object -First 1
          if ($null -eq $installer) {
            Write-Error "Installer not found!"
            exit 1
          }
          Rename-Item -Path $installer.FullName -NewName "${{ env.BUILD_NAME }}.exe"

      - name: Show build artifacts
        shell: bash
        run: |
          ls -alh ./build/bin || true
          ls -alh build/*.app || true

      - name: Archive macOS App
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd build/bin
          zip -r ../../${{ env.BUILD_NAME }}.zip *.app

      - name: Upload Release Assets (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/${{ env.BUILD_NAME }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Preserve native build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ runner.os }}
          path: |
            build/bin/
            *.zip
          if-no-files-found: error
